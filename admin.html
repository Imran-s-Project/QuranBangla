<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>এক্সাম অ্যাডমিন প্যানেল</title>
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root{
    --ink:#1c2b23; --ink-soft:#5c6d64; --panel:#f6f4ee; --line:#e2ddd0;
    --gold:#b8863b; --sage:#e7ecdf; --danger:#c0392b; --parchment:#fbf9f4;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Hind Siliguri',sans-serif; background:var(--panel); color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
  }
  .topbar{
    width:100%; background:var(--parchment); border-bottom:1px solid var(--line);
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
  }
  .topbar h1{font-size:16px; margin:0; display:flex; align-items:center; gap:8px;}
  .topbar h1 i{color:var(--gold);}
  .topbar .who{font-size:12.5px; color:var(--ink-soft); display:flex; align-items:center; gap:10px;}
  .btn{
    border:none; border-radius:10px; padding:9px 16px; font-family:inherit; font-size:13.5px;
    font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary{background:var(--gold); color:#fff;}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-outline{background:none; border:1px solid var(--line); color:var(--ink-soft);}
  .btn-outline:hover{background:var(--sage);}
  .btn-danger{background:none; color:var(--danger); border:1px solid #e6c6c1;}
  .btn-danger:hover{background:#fbeceb;}
  .btn:disabled{opacity:.55; cursor:not-allowed;}

  .wrap{width:100%; max-width:640px; padding:20px 16px 60px;}

  /* ---- Gate screen: shown while the existing site session is being
     verified. Deliberately says nothing about "admin" — a non-admin
     should never learn this page has an admin-only gate at all before
     being sent to 404.html. ---- */
  #gateScreen{
    min-height:80vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; color:var(--ink-soft); font-size:13.5px;
  }
  #gateScreen .spinner{
    width:26px; height:26px; border-radius:50%; border:3px solid var(--line);
    border-top-color:var(--gold); animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---- Panel ---- */
  #panelScreen{display:none; width:100%;}
  .card{
    background:var(--parchment); border:1px solid var(--line); border-radius:14px; padding:18px;
    margin-bottom:18px; box-shadow:0 1px 2px rgba(0,0,0,.03);
  }
  .card h3{margin:0 0 12px; font-size:14.5px; display:flex; align-items:center; gap:8px;}
  .card h3 i{color:var(--gold);}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12.5px; color:var(--ink-soft); margin-bottom:5px;}
  .field input, .field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    font-family:inherit; font-size:14px; background:#fff; color:var(--ink); outline:none;
  }
  .field input:focus, .field textarea:focus{border-color:var(--gold);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .exam-item{
    display:flex; gap:12px; align-items:flex-start; padding:13px 0; border-bottom:1px solid var(--line);
  }
  .exam-item:last-child{border-bottom:none;}
  .exam-item .ei-text{flex:1; min-width:0;}
  .exam-item .ei-title{font-weight:600; font-size:14.5px; word-break:break-word;}
  .exam-item .ei-desc{font-size:12.5px; color:var(--ink-soft); margin-top:2px; word-break:break-word;}
  .exam-item .ei-link{font-size:12px; color:var(--gold); margin-top:4px; word-break:break-all; display:block;}
  .exam-item .ei-meta{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}
  .ei-chip{
    font-size:11.5px; color:var(--ink-soft); background:var(--sage); border-radius:999px;
    padding:3px 10px; display:inline-flex; align-items:center; gap:5px;
  }
  .ei-chip i{color:var(--gold); font-size:10.5px;}
  .exam-item .ei-actions{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); font-size:13px;
  }
  .icon-btn:hover{background:var(--sage);}
  .icon-btn.danger{color:var(--danger); border-color:#e6c6c1;}
  .icon-btn.danger:hover{background:#fbeceb;}
  .empty-note{font-size:13px; color:var(--ink-soft); text-align:center; padding:20px 0;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s ease;
    z-index:99;
  }
  .toast.show{opacity:1;}
  .spinner-row{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-soft); padding:10px 0;}
  .form-actions{display:flex; gap:8px; margin-top:4px;}
</style>
</head>
<body>

<div class="topbar">
  <h1><i class="fa-solid fa-user-shield"></i> এক্সাম অ্যাডমিন প্যানেল</h1>
  <div class="who" id="whoBox" style="display:none;">
    <span id="whoEmail"></span>
    <button class="btn btn-outline" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> লগ-আউট</button>
  </div>
</div>

<!-- ---------- Verifying access ----------
     This is the ONLY screen a non-admin (or signed-out visitor) ever sees
     here — no login form, no "you are not an admin" message. As soon as
     the check below resolves to "not a verified admin", the page is
     replaced with 404.html so the panel's existence is never revealed. -->
<div id="gateScreen">
  <div class="spinner"></div>
  <span>লোড হচ্ছে...</span>
</div>

<!-- ---------- Admin panel ---------- -->
<div class="wrap" id="panelScreen">
  <div class="card">
    <h3><i class="fa-solid fa-plus"></i> নতুন পরীক্ষার লিংক যোগ করুন</h3>
    <div class="field">
      <label for="examTitle">পরীক্ষার নাম *</label>
      <input type="text" id="examTitle" placeholder="যেমন: সূরা আল-বাকারা কুইজ">
    </div>
    <div class="field">
      <label for="examDesc">বিবরণ (ঐচ্ছিক)</label>
      <textarea id="examDesc" rows="2" placeholder="সংক্ষিপ্ত বিবরণ লিখুন..."></textarea>
    </div>
    <div class="field">
      <label for="examLink">পরীক্ষার লিংক *</label>
      <input type="url" id="examLink" placeholder="https://...">
    </div>
    <div class="field-row">
      <div class="field">
        <label for="examDuration">সময়সীমা (মিনিট, ঐচ্ছিক)</label>
        <input type="number" id="examDuration" min="1" max="999" step="1" placeholder="যেমন: ৩০">
      </div>
      <div class="field">
        <label for="examQCount">প্রশ্ন সংখ্যা (ঐচ্ছিক)</label>
        <input type="number" id="examQCount" min="1" max="999" step="1" placeholder="যেমন: ২৫">
      </div>
    </div>
    <button class="btn btn-primary" id="addExamBtn"><i class="fa-solid fa-plus"></i> যোগ করুন</button>
  </div>

  <div class="card">
    <h3><i class="fa-solid fa-list"></i> সব পরীক্ষার লিংক</h3>
    <div id="examListBox"><div class="spinner-row"><i class="fa-solid fa-spinner fa-spin"></i> লোড হচ্ছে...</div></div>
  </div>
</div>

<div class="toast" id="toastBox"></div>

<!-- Firebase (same project as the main site — js/firebase-config.js) -->
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
// ---------- Admin panel: exam-link CRUD ----------
// Access model (hardened):
//   This page has NO login form of its own. It only ever looks at whatever
//   Firebase Auth session already exists on this device — the same session
//   created by signing in normally on the main site (index.html / js/auth.js).
//   Firebase Auth persists that session in this browser (LOCAL persistence,
//   the SDK default), so an admin who is already signed in on the main site
//   is automatically recognised here too, with no second login step.
//
//   On load:
//     - No session at all, OR a session that is NOT a verified admin
//       (admins/{uid} doc missing or isAdmin !== true) → the page is
//       replaced with 404.html. Nothing about this page — not a login box,
//       not a "you're not an admin" message — is ever shown to that visitor.
//     - A verified admin session → the panel renders immediately.
//
// Access control has two layers, and BOTH must hold for a write to actually
// happen — this file's checks are only for a clean UI; the real gate is the
// `isAdmin()` rule in firestore.rules, which every Firestore write is
// checked against no matter what this page does or doesn't show.
//   1) The signed-in Firebase Auth user must have a doc at admins/{uid}
//      with { isAdmin: true } — created manually in the Firebase Console.
//   2) firestore.rules only allows writes to the `exams` collection when
//      that same check passes.

let app, auth, db;
let examsUnsub = null;

function showToast(msg){
  const t = document.getElementById('toastBox');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function goTo404(){
  window.location.replace('404.html');
}

function init(){
  if(typeof firebase === 'undefined' || typeof FIREBASE_CONFIG === 'undefined' || !FIREBASE_CONFIG.apiKey){
    // Firebase can't even initialize — treat exactly like "not an admin":
    // no error detail is exposed here either.
    goTo404();
    return;
  }
  app = firebase.initializeApp(FIREBASE_CONFIG);
  auth = firebase.auth();
  db = firebase.firestore();

  auth.onAuthStateChanged(async (user) => {
    if(examsUnsub){ examsUnsub(); examsUnsub = null; }

    if(!user){
      goTo404();
      return;
    }

    let isAdmin = false;
    try{
      const adminDoc = await db.collection('admins').doc(user.uid).get();
      isAdmin = adminDoc.exists && adminDoc.data().isAdmin === true;
    }catch(e){
      isAdmin = false;
    }

    if(!isAdmin){
      goTo404();
      return;
    }

    document.getElementById('whoEmail').textContent = user.email || '';
    document.getElementById('gateScreen').style.display = 'none';
    document.getElementById('panelScreen').style.display = 'block';
    document.getElementById('whoBox').style.display = 'flex';
    startExamsListener();
  });

  document.getElementById('logoutBtn').onclick = async () => {
    await auth.signOut();
    // No session left to verify against here anymore — send them to the
    // ordinary site instead of re-showing this page.
    window.location.href = 'index.html';
  };
  document.getElementById('addExamBtn').onclick = addExam;
}

function startExamsListener(){
  const box = document.getElementById('examListBox');
  // asc: প্রথমে যোগ করা পরীক্ষা উপরে — ইউজারের "পরীক্ষা" ট্যাবে যেই ক্রমে
  // দেখানো হয়, এডমিন প্যানেলেও একই ক্রম রাখা হয়েছে।
  examsUnsub = db.collection('exams').orderBy('createdAt', 'asc').onSnapshot(
    (snap) => {
      if(snap.empty){
        box.innerHTML = `<div class="empty-note">এখনো কোনো পরীক্ষা যোগ করা হয়নি।</div>`;
        return;
      }
      box.innerHTML = '';
      snap.forEach(doc => box.appendChild(renderExamRow(doc.id, doc.data())));
    },
    (err) => {
      box.innerHTML = `<div class="empty-note">তালিকা লোড করা যায়নি: ${escapeHtml(err.message || '')}</div>`;
    }
  );
}

function metaChipsHtml(data){
  const chips = [];
  if(Number.isFinite(data.durationMinutes)){
    chips.push(`<span class="ei-chip"><i class="fa-solid fa-clock"></i> ${data.durationMinutes} মিনিট</span>`);
  }
  if(Number.isFinite(data.questionCount)){
    chips.push(`<span class="ei-chip"><i class="fa-solid fa-list-ol"></i> ${data.questionCount} টি প্রশ্ন</span>`);
  }
  return chips.length ? `<div class="ei-meta">${chips.join('')}</div>` : '';
}

function renderExamRow(id, data){
  const row = document.createElement('div');
  row.className = 'exam-item';
  row.innerHTML = `
    <div class="ei-text">
      <div class="ei-title">${escapeHtml(data.title || '(নাম নেই)')}</div>
      ${data.description ? `<div class="ei-desc">${escapeHtml(data.description)}</div>` : ''}
      <a class="ei-link" href="${escapeAttr(data.link || '#')}" target="_blank" rel="noopener">${escapeHtml(data.link || '')}</a>
      ${metaChipsHtml(data)}
    </div>
    <div class="ei-actions">
      <button class="icon-btn" title="এডিট"><i class="fa-solid fa-pen"></i></button>
      <button class="icon-btn danger" title="মুছুন"><i class="fa-solid fa-trash"></i></button>
    </div>`;
  row.querySelector('.icon-btn:not(.danger)').onclick = () => editExam(id, data, row);
  row.querySelector('.icon-btn.danger').onclick = () => deleteExam(id, data.title);
  return row;
}

function editExam(id, data, row){
  row.innerHTML = `
    <div class="ei-text" style="width:100%;">
      <div class="field"><input type="text" class="edit-title" value="${escapeAttr(data.title || '')}" placeholder="পরীক্ষার নাম"></div>
      <div class="field"><textarea class="edit-desc" rows="2" placeholder="বিবরণ (ঐচ্ছিক)">${escapeHtml(data.description || '')}</textarea></div>
      <div class="field"><input type="url" class="edit-link" value="${escapeAttr(data.link || '')}" placeholder="https://..."></div>
      <div class="field-row">
        <div class="field"><input type="number" class="edit-duration" min="1" max="999" step="1" value="${Number.isFinite(data.durationMinutes) ? data.durationMinutes : ''}" placeholder="সময়সীমা (মিনিট)"></div>
        <div class="field"><input type="number" class="edit-qcount" min="1" max="999" step="1" value="${Number.isFinite(data.questionCount) ? data.questionCount : ''}" placeholder="প্রশ্ন সংখ্যা"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary edit-save"><i class="fa-solid fa-check"></i> সংরক্ষণ করুন</button>
        <button class="btn btn-outline edit-cancel">বাতিল</button>
      </div>
    </div>`;
  row.querySelector('.edit-cancel').onclick = () => row.replaceWith(renderExamRow(id, data));
  row.querySelector('.edit-save').onclick = async () => {
    const title = row.querySelector('.edit-title').value.trim();
    const description = row.querySelector('.edit-desc').value.trim();
    const link = row.querySelector('.edit-link').value.trim();
    const durationRaw = row.querySelector('.edit-duration').value.trim();
    const qCountRaw = row.querySelector('.edit-qcount').value.trim();
    if(!title || !link){ showToast('নাম ও লিংক আবশ্যক'); return; }

    const update = {
      title, description, link,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    const durationVal = parseNumericField(durationRaw, 'সময়সীমা');
    if(durationVal === false) return;
    if(durationVal !== null) update.durationMinutes = durationVal;
    else update.durationMinutes = firebase.firestore.FieldValue.delete();

    const qCountVal = parseNumericField(qCountRaw, 'প্রশ্ন সংখ্যা');
    if(qCountVal === false) return;
    if(qCountVal !== null) update.questionCount = qCountVal;
    else update.questionCount = firebase.firestore.FieldValue.delete();

    try{
      await db.collection('exams').doc(id).update(update);
      showToast('পরিবর্তন সংরক্ষণ হয়েছে');
    }catch(e){
      showToast('সংরক্ষণ ব্যর্থ হয়েছে: ' + (e.message || ''));
    }
  };
}

async function deleteExam(id, title){
  if(!confirm(`"${title || 'এই পরীক্ষাটি'}" মুছে ফেলতে চান?`)) return;
  try{
    await db.collection('exams').doc(id).delete();
    showToast('পরীক্ষাটি মুছে ফেলা হয়েছে');
  }catch(e){
    showToast('মোছা ব্যর্থ হয়েছে: ' + (e.message || ''));
  }
}

// Validates an optional positive-integer field (duration / question count).
// Returns: null (left empty — omit the field), a number (valid), or false
// (invalid — a toast was already shown, caller should abort the save).
function parseNumericField(raw, label){
  if(!raw) return null;
  const n = Number(raw);
  if(!Number.isFinite(n) || !Number.isInteger(n) || n <= 0 || n > 999){
    showToast(`${label} সঠিক একটি সংখ্যা (১-৯৯৯) হতে হবে`);
    return false;
  }
  return n;
}

async function addExam(){
  const titleEl = document.getElementById('examTitle');
  const descEl = document.getElementById('examDesc');
  const linkEl = document.getElementById('examLink');
  const durationEl = document.getElementById('examDuration');
  const qCountEl = document.getElementById('examQCount');
  const title = titleEl.value.trim();
  const description = descEl.value.trim();
  const link = linkEl.value.trim();
  if(!title || !link){ showToast('পরীক্ষার নাম ও লিংক দুটোই দিন'); return; }
  try{
    new URL(link);
  }catch(e){
    showToast('সঠিক একটি লিংক (URL) দিন'); return;
  }

  const durationVal = parseNumericField(durationEl.value.trim(), 'সময়সীমা');
  if(durationVal === false) return;
  const qCountVal = parseNumericField(qCountEl.value.trim(), 'প্রশ্ন সংখ্যা');
  if(qCountVal === false) return;

  const btn = document.getElementById('addExamBtn');
  btn.disabled = true;
  try{
    const payload = {
      title, description, link,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      createdBy: auth.currentUser ? auth.currentUser.uid : null
    };
    if(durationVal !== null) payload.durationMinutes = durationVal;
    if(qCountVal !== null) payload.questionCount = qCountVal;
    await db.collection('exams').add(payload);
    titleEl.value = ''; descEl.value = ''; linkEl.value = ''; durationEl.value = ''; qCountEl.value = '';
    showToast('নতুন পরীক্ষা যোগ করা হয়েছে');
  }catch(e){
    showToast('যোগ করা ব্যর্থ হয়েছে: ' + (e.message || ''));
  }finally{
    btn.disabled = false;
  }
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

init();
</script>
</body>
</html>
